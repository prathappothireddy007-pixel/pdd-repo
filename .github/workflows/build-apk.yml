name: Build Android APK

on:
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          
      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        
      - name: Install dependencies
        working-directory: ./online-auction-expo
        run: npm install
        
      - name: Prebuild Android project
        working-directory: ./online-auction-expo
        run: npx expo prebuild --platform android --clean
        
      - name: Configure Gradle Memory
        working-directory: ./online-auction-expo/android
        run: echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m" >> gradle.properties

      - name: Build APK
        working-directory: ./online-auction-expo/android
        run: |
          # Force release to use debug keystore so it installs easily on phones without a production keystore
          sed -i 's/signingConfig signingConfigs.debug/signingConfig signingConfigs.debug/' app/build.gradle
          # Pass minSdk 24 because react-native-webview 14+ requires Android 7.0+
          ./gradlew assembleRelease -Pandroid.minSdkVersion=24
        
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release.apk
          path: ./online-auction-expo/android/app/build/outputs/apk/release/app-release.apk
